<svg width="100%" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Scope 1: digest-based verification — no tag exists yet at this stage</title>
  <desc>Scope 1 verification uses only the Platform Image digests from the artifact lock file. No tag exists at this point — the tag is only created after the release in Scope 2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
      .th { font-size: 13px; font-weight: 600; }
      .ts { font-size: 11px; font-weight: 400; }
      .tl { font-size: 10px; font-weight: 400; fill: #888; }
      .tm { font-size: 10px; font-weight: 600; }
    </style>
  </defs>
  <rect width="680" height="780" fill="#fafaf8"/>

  <!-- Artifact Lock Commit -->
  <rect x="220" y="28" width="240" height="60" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
  <text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central" fill="#085041">Artifact Lock Commit</text>
  <text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">a3f19c72… · cosign.pub signed</text>

  <!-- artifact-lock.json callout -->
  <rect x="476" y="28" width="184" height="60" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="568" y="44" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">artifact-lock.json</text>
  <text class="ts" x="568" y="60" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">image@sha256:a1b2c3…</text>
  <text class="tl" x="568" y="76" text-anchor="middle" dominant-baseline="central">no tag — digest only</text>
  <line x1="460" y1="58" x2="476" y2="58" stroke="#888780" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Scope 1 Signature -->
  <line x1="340" y1="88" x2="340" y2="118" stroke="#0f6e56" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <rect x="160" y="118" width="360" height="80" rx="10" fill="#085041" stroke="#0f6e56" stroke-width="1"/>
  <text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central" fill="#e1f5ee">Scope 1 Signature</text>
  <text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central" fill="#9fe1cb">Platform Image digest · Lock Commit · cosign.pub</text>
  <text class="tl" x="340" y="174" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5">verified against digests from artifact-lock — not a tag</text>
  <text class="tl" x="340" y="188" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5">tag does not exist yet · tag is created in Scope 2 (release)</text>

  <!-- Pipeline verification -->
  <text class="tm" x="116" y="236" text-anchor="middle" dominant-baseline="central" fill="#534ab7">Pipeline verification</text>
  <rect x="28" y="250" width="176" height="48" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text class="th" x="116" y="268" text-anchor="middle" dominant-baseline="central" fill="#26215c">Build stage</text>
  <text class="ts" x="116" y="284" text-anchor="middle" dominant-baseline="central" fill="#534ab7">signs · writes lock commit</text>
  <line x1="116" y1="298" x2="116" y2="322" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="28" y="322" width="176" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
  <text class="th" x="116" y="340" text-anchor="middle" dominant-baseline="central" fill="#26215c">Test stage</text>
  <text class="ts" x="116" y="356" text-anchor="middle" dominant-baseline="central" fill="#534ab7">verify sig + digest</text>
  <text class="tl" x="116" y="370" text-anchor="middle" dominant-baseline="central">from artifact-lock, not tag</text>
  <line x1="116" y1="378" x2="116" y2="402" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="28" y="402" width="176" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
  <text class="th" x="116" y="420" text-anchor="middle" dominant-baseline="central" fill="#26215c">Release stage</text>
  <text class="ts" x="116" y="436" text-anchor="middle" dominant-baseline="central" fill="#534ab7">verify sig + digest</text>
  <text class="tl" x="116" y="450" text-anchor="middle" dominant-baseline="central">from artifact-lock, not tag</text>
  <text class="tl" x="116" y="474" text-anchor="middle" dominant-baseline="central">every stage re-verifies before proceeding</text>

  <!-- Governance -->
  <text class="tm" x="564" y="236" text-anchor="middle" dominant-baseline="central" fill="#854f0b">Governance / compliance</text>
  <rect x="476" y="250" width="176" height="72" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
  <text class="th" x="564" y="268" text-anchor="middle" dominant-baseline="central" fill="#412402">DevGuard</text>
  <text class="ts" x="564" y="284" text-anchor="middle" dominant-baseline="central" fill="#854f0b">verifies Scope 1 sig</text>
  <text class="tl" x="564" y="300" text-anchor="middle" dominant-baseline="central">digest from artifact-lock</text>
  <text class="tl" x="564" y="314" text-anchor="middle" dominant-baseline="central">gates release on integrity check</text>

  <rect x="476" y="342" width="176" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="th" x="564" y="360" text-anchor="middle" dominant-baseline="central" fill="#412402">Any compliance tool</text>
  <text class="ts" x="564" y="376" text-anchor="middle" dominant-baseline="central" fill="#854f0b">cosign verify --key cosign.pub</text>
  <text class="tl" x="564" y="392" text-anchor="middle" dominant-baseline="central">image@sha256:… (no tag needed)</text>
  <text class="tl" x="564" y="416" text-anchor="middle" dominant-baseline="central">verifiable at any time, by any tool</text>

  <!-- Arrows from Scope 1 Sig -->
  <path d="M220 158 Q116 158 116 250" fill="none" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M460 158 Q564 158 564 250" fill="none" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Threat model -->
  <rect x="28" y="510" width="624" height="110" rx="10" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.8"/>
  <text class="tm" x="340" y="532" text-anchor="middle" dominant-baseline="central" fill="#501313">Without Scope 1 signature — attack surface</text>
  <rect x="48" y="550" width="148" height="52" rx="8" fill="#f7c1c1" stroke="#a32d2d" stroke-width="0.5"/>
  <text class="th" x="122" y="568" text-anchor="middle" dominant-baseline="central" fill="#501313">Attacker</text>
  <text class="ts" x="122" y="584" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">swaps attestations</text>
  <rect x="228" y="550" width="148" height="52" rx="8" fill="#f7c1c1" stroke="#a32d2d" stroke-width="0.5"/>
  <text class="th" x="302" y="568" text-anchor="middle" dominant-baseline="central" fill="#501313">Unsigned image</text>
  <text class="ts" x="302" y="584" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">different digest</text>
  <rect x="408" y="550" width="224" height="52" rx="8" fill="#f7c1c1" stroke="#a32d2d" stroke-width="0.5"/>
  <text class="th" x="520" y="568" text-anchor="middle" dominant-baseline="central" fill="#501313">Forged SBOM / Provenance</text>
  <text class="ts" x="520" y="584" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">plausible but unbound</text>
  <line x1="196" y1="576" x2="228" y2="576" stroke="#a32d2d" stroke-width="1" fill="none" marker-end="url(#arrow-red)"/>
  <line x1="376" y1="576" x2="408" y2="576" stroke="#a32d2d" stroke-width="1" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Release gate -->
  <rect x="220" y="660" width="240" height="52" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
  <text class="th" x="340" y="678" text-anchor="middle" dominant-baseline="central" fill="#173404">→ Scope 2: Release</text>
  <text class="ts" x="340" y="694" text-anchor="middle" dominant-baseline="central" fill="#3b6d11">tag created here for the first time ✓</text>
  <line x1="116" y1="458" x2="280" y2="660" stroke="#534ab7" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <line x1="564" y1="398" x2="400" y2="660" stroke="#854f0b" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="44" y1="742" x2="76" y2="742" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="tl" x="84" y="746" dominant-baseline="central">Scope 1 sig propagated to verifier</text>
  <line x1="310" y1="742" x2="342" y2="742" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="tl" x="350" y="746" dominant-baseline="central">pipeline / governance flow</text>
  <line x1="510" y1="742" x2="542" y2="742" stroke="#a32d2d" stroke-width="1" fill="none" marker-end="url(#arrow-red)"/>
  <text class="tl" x="550" y="746" dominant-baseline="central">attack path (no sig)</text>
</svg>
