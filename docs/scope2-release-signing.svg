<svg width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Scope 2: Multi-Arch Release Image as pure OCI manifest referencing already-signed Platform Images by digest</title>
  <desc>The release image is not a new build artifact. It is an OCI index manifest that references the existing signed Platform Images by digest. Attestations (SBOM, Provenance) remain attached to the Platform Images unchanged. The release manifest inherits them through the OCI reference chain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
      .th { font-size: 13px; font-weight: 600; }
      .ts { font-size: 11px; font-weight: 400; }
      .tl { font-size: 10px; font-weight: 400; fill: #888; }
    </style>
  </defs>

  <rect width="680" height="680" fill="#fafaf8"/>

  <!-- All Scope 1 passed -->
  <rect x="160" y="20" width="360" height="40" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.8"/>
  <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central" fill="#173404">All Scope 1 verifications passed ✓</text>
  <line x1="340" y1="60" x2="340" y2="84" stroke="#3b6d11" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Multi-Arch Release Manifest -->
  <rect x="140" y="84" width="400" height="88" rx="10" fill="#412402" stroke="#854f0b" stroke-width="1"/>
  <text class="th" x="340" y="106" text-anchor="middle" dominant-baseline="central" fill="#faeeda">Multi-Arch Release Manifest</text>
  <text class="ts" x="340" y="124" text-anchor="middle" dominant-baseline="central" fill="#f0997b">registry/…:web-workflow</text>
  <text class="tl" x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="#ba7517">OCI index — no new layers · pure digest references to Platform Images</text>
  <text class="tl" x="340" y="158" text-anchor="middle" dominant-baseline="central" fill="#ba7517">signed with Build Trigger Commit · tag created here for the first time</text>

  <!-- OCI annotation -->
  <rect x="20" y="100" width="108" height="40" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="74" y="116" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a" style="font-size:10px">OCI Annotation</text>
  <text class="tl" x="74" y="130" text-anchor="middle" dominant-baseline="central">image.revision:</text>
  <line x1="128" y1="120" x2="140" y2="120" stroke="#888780" stroke-width="0.7" fill="none" marker-end="url(#arrow)"/>

  <!-- OCI Registry container -->
  <rect x="28" y="220" width="624" height="340" rx="12" fill="none" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="6 4"/>
  <text class="tl" x="44" y="238" dominant-baseline="central" font-weight="600" fill="#5f5e5a">OCI Registry — pure manifest references, no data copied</text>

  <!-- Platform Image amd64 -->
  <rect x="52" y="252" width="172" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text class="th" x="138" y="272" text-anchor="middle" dominant-baseline="central" fill="#085041">Platform Image</text>
  <text class="ts" x="138" y="290" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">linux/amd64</text>
  <text class="tl" x="138" y="306" text-anchor="middle" dominant-baseline="central">sha256:a1b2…</text>
  <rect x="64" y="316" width="148" height="44" rx="6" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.4"/>
  <text class="tl" x="138" y="332" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="600">Scope 1 Signature</text>
  <text class="tl" x="138" y="348" text-anchor="middle" dominant-baseline="central" fill="#085041">SBOM · Provenance</text>

  <!-- Platform Image arm64 -->
  <rect x="254" y="252" width="172" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text class="th" x="340" y="272" text-anchor="middle" dominant-baseline="central" fill="#085041">Platform Image</text>
  <text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">linux/arm64</text>
  <text class="tl" x="340" y="306" text-anchor="middle" dominant-baseline="central">sha256:c3d4…</text>
  <rect x="266" y="316" width="148" height="44" rx="6" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.4"/>
  <text class="tl" x="340" y="332" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="600">Scope 1 Signature</text>
  <text class="tl" x="340" y="348" text-anchor="middle" dominant-baseline="central" fill="#085041">SBOM · Provenance</text>

  <!-- Platform Image arm/v7 -->
  <rect x="456" y="252" width="172" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text class="th" x="542" y="272" text-anchor="middle" dominant-baseline="central" fill="#085041">Platform Image</text>
  <text class="ts" x="542" y="290" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">linux/arm/v7</text>
  <text class="tl" x="542" y="306" text-anchor="middle" dominant-baseline="central">sha256:e5f6…</text>
  <rect x="468" y="316" width="148" height="44" rx="6" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.4"/>
  <text class="tl" x="542" y="332" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="600">Scope 1 Signature</text>
  <text class="tl" x="542" y="348" text-anchor="middle" dominant-baseline="central" fill="#085041">SBOM · Provenance</text>

  <!-- Attestations unchanged note -->
  <rect x="52" y="394" width="576" height="36" rx="6" fill="#f1efe8" stroke="#888780" stroke-width="0.4"/>
  <text class="tl" x="340" y="412" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#2c2c2a">Attestations remain unchanged on Platform Images — not copied, not re-signed</text>

  <!-- OCI digest reference arrows -->
  <line x1="200" y1="172" x2="138" y2="252" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
  <line x1="340" y1="172" x2="340" y2="252" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
  <line x1="480" y1="172" x2="542" y2="252" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>

  <!-- Reference labels -->
  <text class="tl" x="156" y="208" text-anchor="middle" dominant-baseline="central">ref@sha256:a1b2…</text>
  <text class="tl" x="340" y="208" text-anchor="middle" dominant-baseline="central">ref@sha256:c3d4…</text>
  <text class="tl" x="516" y="208" text-anchor="middle" dominant-baseline="central">ref@sha256:e5f6…</text>

  <!-- Scope 2 signature on manifest -->
  <rect x="140" y="450" width="400" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
  <text class="th" x="340" y="468" text-anchor="middle" dominant-baseline="central" fill="#412402">Scope 2 Signature on release manifest</text>
  <text class="tl" x="340" y="484" text-anchor="middle" dominant-baseline="central">cosign · keyless or key-mode · Build Trigger Commit embedded</text>
  <line x1="340" y1="430" x2="340" y2="450" stroke="#854f0b" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Verification -->
  <rect x="140" y="530" width="400" height="52" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.8"/>
  <text class="th" x="340" y="550" text-anchor="middle" dominant-baseline="central" fill="#173404">cosign verify --key cosign.pub</text>
  <text class="ts" x="340" y="568" text-anchor="middle" dominant-baseline="central" fill="#3b6d11">registry/…:web-workflow  (resolves all platform refs)</text>
  <line x1="340" y1="494" x2="340" y2="530" stroke="#3b6d11" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="44" y1="642" x2="76" y2="642" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tl" x="84" y="646" dominant-baseline="central">OCI digest reference (no data copy)</text>
  <line x1="340" y1="642" x2="372" y2="642" stroke="#0f6e56" stroke-width="1.2"/>
  <text class="tl" x="380" y="646" dominant-baseline="central">Scope 1 sig + attestations (unchanged)</text>
</svg>
