<svg width="100%" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Two-commit cryptographic architecture: build trigger commit and artifact lock commit as independent anchors</title>
  <desc>The build trigger commit anchors the release image signature (Scope 2). After the pipeline resolves platform image digests, it writes a new artifact lock commit which anchors Scope 1. Both commits are independently verifiable and cryptographically bound to their respective signing scopes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
      .th  { font-size: 13px; font-weight: 600; }
      .ts  { font-size: 11px; font-weight: 400; }
      .tl  { font-size: 10px; font-weight: 400; fill: #888; }
    </style>
  </defs>
  <rect width="680" height="760" fill="#fafaf8"/>

  <!-- CI Pipeline trigger sources -->
  <rect x="28" y="28" width="180" height="112" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="ts" x="118" y="46" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-weight="600">CI Pipeline trigger</text>
  <text class="tl" x="118" y="66" text-anchor="middle" dominant-baseline="central">push / Renovate MR</text>
  <text class="tl" x="118" y="82" text-anchor="middle" dominant-baseline="central">manual pipeline</text>
  <text class="tl" x="118" y="98" text-anchor="middle" dominant-baseline="central">scheduled run</text>
  <text class="tl" x="118" y="114" text-anchor="middle" dominant-baseline="central">tag / release event</text>
  <line x1="208" y1="84" x2="258" y2="84" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Build Trigger Commit -->
  <rect x="258" y="52" width="200" height="64" rx="10" fill="#faeeda" stroke="#854f0b" stroke-width="1.2"/>
  <text class="th" x="358" y="72" text-anchor="middle" dominant-baseline="central" fill="#412402">Build Trigger Commit</text>
  <text class="ts" x="358" y="92" text-anchor="middle" dominant-baseline="central" fill="#854f0b">6b7792e4…</text>
  <text class="tl" x="358" y="128" text-anchor="middle" dominant-baseline="central">anchors release image signature</text>

  <!-- Pipeline band -->
  <rect x="28" y="160" width="624" height="44" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.5"/>
  <text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-weight="600">Pipeline runs — resolves Platform Image digests</text>
  <line x1="358" y1="116" x2="358" y2="160" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Artifact Lock Commit -->
  <line x1="358" y1="204" x2="358" y2="238" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <rect x="258" y="238" width="200" height="64" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
  <text class="th" x="358" y="258" text-anchor="middle" dominant-baseline="central" fill="#085041">Artifact Lock Commit</text>
  <text class="ts" x="358" y="278" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">a3f19c72…  ← written by pipeline</text>
  <text class="tl" x="358" y="314" text-anchor="middle" dominant-baseline="central">anchors platform image integrity (Scope 1)</text>

  <!-- Decoupled annotation -->
  <rect x="476" y="244" width="184" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text class="ts" x="568" y="262" text-anchor="middle" dominant-baseline="central" fill="#26215c" font-weight="600">decoupled ✓</text>
  <text class="tl" x="568" y="278" text-anchor="middle" dominant-baseline="central">trigger ≠ lock commit</text>
  <text class="tl" x="568" y="291" text-anchor="middle" dominant-baseline="central">reproducible + auditable</text>
  <line x1="476" y1="270" x2="458" y2="270" stroke="#534ab7" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>

  <!-- SCOPE 1 -->
  <rect x="28" y="348" width="256" height="180" rx="12" fill="none" stroke="#0f6e56" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="44" y="366" dominant-baseline="central" fill="#0f6e56" font-weight="600">Scope 1 — Platform Image Integrity</text>
  <rect x="44" y="380" width="152" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text class="th" x="120" y="396" text-anchor="middle" dominant-baseline="central" fill="#085041">Artifact Lock</text>
  <text class="ts" x="120" y="412" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">SHA digest pinned</text>
  <rect x="44" y="448" width="152" height="44" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text class="th" x="120" y="464" text-anchor="middle" dominant-baseline="central" fill="#085041">OCI Registry</text>
  <text class="ts" x="120" y="480" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">Platform Image @ digest</text>
  <rect x="208" y="400" width="60" height="36" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="238" y="414" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a" style="font-size:12px">cosign</text>
  <text class="ts" x="238" y="428" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">.pub</text>
  <line x1="120" y1="424" x2="120" y2="448" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <line x1="238" y1="444" x2="238" y2="400" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.6"/>
  <text class="tl" x="252" y="426" dominant-baseline="central">verify</text>

  <!-- Artifact Lock Commit → Scope 1 -->
  <path d="M280 302 Q200 302 196 380" fill="none" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M198 378 Q200 298 278 302" fill="none" stroke="#0f6e56" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.4"/>
  <text class="tl" x="186" y="344" text-anchor="middle" dominant-baseline="central">embedded</text>

  <!-- SCOPE 2 -->
  <rect x="396" y="348" width="256" height="260" rx="12" fill="none" stroke="#854f0b" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="412" y="366" dominant-baseline="central" fill="#854f0b" font-weight="600">Scope 2 — Release Image Signing</text>
  <rect x="412" y="380" width="224" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text class="th" x="524" y="396" text-anchor="middle" dominant-baseline="central" fill="#412402">Keyless (default)</text>
  <text class="ts" x="524" y="412" text-anchor="middle" dominant-baseline="central" fill="#854f0b">OIDC cert · Rekor log entry</text>
  <rect x="412" y="444" width="224" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text class="th" x="524" y="460" text-anchor="middle" dominant-baseline="central" fill="#412402">Key-mode (private infra)</text>
  <text class="ts" x="524" y="476" text-anchor="middle" dominant-baseline="central" fill="#854f0b">COSIGN_SIGNING_MODE=key</text>
  <rect x="412" y="508" width="104" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text class="th" x="464" y="524" text-anchor="middle" dominant-baseline="central" fill="#412402">SBOM</text>
  <text class="ts" x="464" y="540" text-anchor="middle" dominant-baseline="central" fill="#854f0b">CycloneDX</text>
  <rect x="528" y="508" width="108" height="44" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text class="th" x="582" y="524" text-anchor="middle" dominant-baseline="central" fill="#412402">Provenance</text>
  <text class="ts" x="582" y="540" text-anchor="middle" dominant-baseline="central" fill="#854f0b">SLSA L2</text>
  <line x1="524" y1="424" x2="524" y2="444" stroke="#888780" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
  <line x1="464" y1="488" x2="464" y2="508" stroke="#888780" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
  <line x1="582" y1="488" x2="582" y2="508" stroke="#888780" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Build Trigger Commit → Scope 2 -->
  <path d="M436 116 Q524 116 524 380" fill="none" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M522 382 Q520 118 438 116" fill="none" stroke="#854f0b" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.4"/>
  <text class="tl" x="544" y="248" dominant-baseline="central">embedded</text>

  <!-- OCI Annotation -->
  <rect x="140" y="660" width="400" height="44" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="340" y="678" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">OCI Annotation</text>
  <text class="ts" x="340" y="694" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">org.opencontainers.image.revision: 6b7792e4…</text>
  <line x1="358" y1="116" x2="340" y2="660" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="44" y1="728" x2="76" y2="728" stroke="#888" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="tl" x="84" y="732" dominant-baseline="central">commit embedded (bidirectional)</text>
  <line x1="310" y1="728" x2="342" y2="728" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="tl" x="350" y="732" dominant-baseline="central">cryptographic dependency</text>
</svg>
